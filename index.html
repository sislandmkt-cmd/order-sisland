<style>
/* Layout: single-column mobile menu — sticky category rail up top, scrolling dish list,
   sticky cart bar pinned to the bottom that expands into a drawer before checkout via WhatsApp */
:root{
  --bg:#FBF6EE;
  --surface:#FFFFFF;
  --ink:#241B14;
  --ink-soft:#73695D;
  --line:#E7DDCC;
  --accent:#C1442A;
  --accent-ink:#FFF7EE;
  --gold:#B8862E;
  --ok:#3E7A4F;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B140D;
    --surface:#241B13;
    --ink:#F4ECDF;
    --ink-soft:#B9AC98;
    --line:#3A2E20;
    --accent:#E2663F;
    --accent-ink:#1B140D;
    --gold:#D9A94C;
    --ok:#6FBF85;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B140D;
  --surface:#241B13;
  --ink:#F4ECDF;
  --ink-soft:#B9AC98;
  --line:#3A2E20;
  --accent:#E2663F;
  --accent-ink:#1B140D;
  --gold:#D9A94C;
  --ok:#6FBF85;
  color-scheme: dark;
}

*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Source Sans 3','Segoe UI',sans-serif;
  padding-inline:0;
  min-height:100%;
}
.font-display{font-family:'Fraunces','Georgia',serif;}
h1,h2,h3{font-family:'Fraunces','Georgia',serif; text-wrap:balance; margin:0;}

.wrap{max-width:460px;margin:0 auto;position:relative;padding-bottom:96px;}

/* Header */
.hero{
  padding:84px 18px 16px;
  background:
    linear-gradient(180deg, rgba(10,7,4,.15), var(--bg) 92%),
    url('hero-restaurante.jpg') center 38% / cover no-repeat;
  border-bottom:1px solid var(--line);
}
.table-chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px 5px 10px;
  font-size:12.5px;font-weight:600;color:var(--ink-soft);
  letter-spacing:.02em;
}
.table-chip b{color:var(--accent);font-weight:700;}
.brand-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:12px;}
.brand-name{font-size:26px;font-weight:600;line-height:1.1;}
.brand-tag{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
.mark{
  width:46px;height:46px;border-radius:12px;flex-shrink:0;
  background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:700;font-size:18px;
}

/* Category rail */
.rail{
  position:sticky;top:env(safe-area-inset-top,0px);
  z-index:5;background:var(--bg);
  display:flex;gap:8px;padding:12px 18px;overflow-x:auto;
  border-bottom:1px solid var(--line);
  scrollbar-width:none;
}
.rail::-webkit-scrollbar{display:none;}
.cat-btn{
  flex:0 0 auto;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-soft);font-weight:600;font-size:13px;
  padding:8px 14px;border-radius:999px;cursor:pointer;
  font-family:inherit;transition:background .15s, color .15s, border-color .15s;
}
.cat-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

/* Sections */
.section{padding:22px 18px 4px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
.section-head .count{font-size:12px;color:var(--ink-soft);}
.section-title{font-size:20px;font-weight:600;}

.dish{
  display:flex;gap:12px;align-items:flex-start;
  padding:14px 0;border-bottom:1px solid var(--line);
}
.dish:last-child{border-bottom:none;}
.dish-photo{
  width:72px;height:72px;border-radius:10px;flex-shrink:0;object-fit:cover;
  background:var(--line);
}
.dish-info{flex:1;min-width:0;}
.dish-name{font-size:15.5px;font-weight:700;line-height:1.25;}
.dish-desc{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}
.dish-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.dish-price{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--accent);}
.dish-custom-link{
  background:none;border:none;color:var(--accent);font-family:inherit;font-size:11.5px;font-weight:700;
  padding:0;margin-top:5px;cursor:pointer;text-decoration:underline;
}

.qty-control{display:flex;align-items:center;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.qty-btn{
  width:28px;height:28px;border:none;background:transparent;color:var(--ink);
  font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
}
.qty-btn:active{background:var(--line);}
.qty-val{min-width:20px;text-align:center;font-size:13.5px;font-weight:700;}
.add-btn{
  width:28px;height:28px;border:none;border-radius:8px;background:var(--accent);color:var(--accent-ink);
  font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
}
.add-btn:active{opacity:.8;}

/* Cart bar */
.cart-bar{
  position:fixed;left:0;right:0;bottom:0;
  max-width:460px;margin:0 auto;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-radius:16px 16px 0 0;
  box-shadow:0 -8px 24px rgba(0,0,0,.18);
  cursor:pointer; border:none; width:100%; font-family:inherit;
  transition:transform .2s ease;
}
.cart-bar[hidden]{display:none;}
.cart-left{display:flex;align-items:center;gap:10px;text-align:left;}
.cart-badge{
  background:var(--accent);color:var(--accent-ink);
  width:24px;height:24px;border-radius:50%;
  font-size:12.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.cart-label{font-size:12px;color:color-mix(in srgb, var(--bg) 60%, transparent);}
.cart-total{font-family:'Fraunces',serif;font-weight:600;font-size:16px;}
.cart-cta{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;}

/* Drawer */
.scrim{
  position:fixed;inset:0;background:rgba(10,7,4,.5);z-index:20;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.scrim.open{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;left:0;right:0;bottom:0;z-index:21;
  max-width:460px;margin:0 auto;
  background:var(--bg);border-radius:18px 18px 0 0;
  max-height:82vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .25s ease;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.open{transform:translateY(0);}
.drawer-head{
  padding:16px 18px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.drawer-head h2{font-size:18px;}
.close-btn{
  width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-soft);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.drawer-body{flex:1;overflow-y:auto;padding:4px 18px;}
.cart-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.cart-row-name{flex:1;min-width:0;font-size:14px;font-weight:600;}
.cart-row-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.cart-row-price{font-family:'Fraunces',serif;font-weight:600;font-size:13.5px;color:var(--accent);white-space:nowrap;}
.cart-row-note{font-size:11px;color:var(--gold);margin-top:2px;}
.empty-cart{padding:40px 10px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

.note-field{
  margin:12px 0 16px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
}
.note-field label{font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.note-field textarea{
  width:100%;border:none;background:transparent;color:var(--ink);font-family:inherit;font-size:13.5px;resize:none;outline:none;
}

.drawer-foot{padding:14px 18px 18px;border-top:1px solid var(--line);background:var(--bg);}
.total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.total-row .label{font-size:13px;color:var(--ink-soft);}
.total-row .value{font-family:'Fraunces',serif;font-size:22px;font-weight:600;}
.send-btn{
  width:100%;border:none;border-radius:11px;padding:15px;
  background:#2FAF5B;color:#fff;font-weight:700;font-size:14.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:inherit;
}
.send-btn:active{opacity:.85;}
.send-sub{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:9px;}

.toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;
  font-size:12.5px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s ease, transform .2s ease;
  pointer-events:none; white-space:nowrap; max-width:90%;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.copy-row{
  display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:9px 12px;margin-top:4px;
}
.copy-row span{font-size:13px;font-weight:600;flex:1;}
.copy-row button{
  border:none;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;
  padding:6px 10px;border-radius:7px;cursor:pointer;font-family:inherit;
}

/* Onboarding (mesa + mesero) */
.onboard-scrim{
  position:fixed;inset:0;background:rgba(10,7,4,.6);z-index:40;
  display:flex;align-items:flex-end;justify-content:center;
}
.onboard-card{
  width:100%;max-width:460px;background:var(--bg);border-radius:18px 18px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));
}
.onboard-card h2{font-size:19px;margin-bottom:5px;}
.onboard-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;line-height:1.4;}
.field{margin-bottom:14px;}
.field label{font-size:12px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.field input, .field select, .field textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-family:inherit;font-size:15px;padding:12px 13px;border-radius:9px;outline:none;resize:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
.detail-photo{width:100%;height:160px;border-radius:12px;object-fit:cover;background:var(--line);}
.detail-chips{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 16px;}
.detail-chip{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
  font-family:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;
}
.detail-chip:active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.onboard-go{
  width:100%;border:none;border-radius:11px;padding:14px;margin-top:4px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit;
}
.onboard-err{font-size:12px;color:var(--accent);margin:-8px 0 12px;display:none;}
.change-link{
  background:none;border:none;color:inherit;text-decoration:underline;
  font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:0;margin-left:8px;
}

/* Confirmación / seguimiento de pedido */
.sent-wrap{padding:18px 4px 10px;text-align:center;}
.sent-check{
  width:54px;height:54px;border-radius:50%;background:var(--ok);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px;
}
.sent-folio{font-size:13px;color:var(--ink-soft);margin-top:4px;margin-bottom:22px;}
.track{display:flex;flex-direction:column;gap:0;text-align:left;margin:0 auto;max-width:280px;}
.track-row{display:flex;align-items:center;gap:12px;padding:8px 0;opacity:.4;}
.track-row.done{opacity:1;}
.track-dot{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  background:var(--line);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
}
.track-row.done .track-dot{background:var(--ok);}
.track-text{font-size:13.5px;font-weight:600;}
.sent-total{font-size:13px;color:var(--ink-soft);margin-top:20px;}

/* Pantalla de cocina (operador) */
.k-header{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:18px 22px;background:var(--surface);border-bottom:1px solid var(--line);
}
.k-title{font-size:19px;font-weight:600;}
.k-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.k-live{font-size:12.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
.k-board{
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
  padding:18px 22px 40px;align-items:start;
}
@media (max-width:760px){ .k-board{grid-template-columns:1fr;} }
.k-col{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;}
.k-col-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--line);
  font-weight:700;font-size:13.5px;letter-spacing:.02em;
}
.k-count{
  background:var(--bg);border:1px solid var(--line);border-radius:999px;
  padding:1px 9px;font-size:12px;color:var(--ink-soft);
}
.k-col-body{padding:12px;display:flex;flex-direction:column;gap:12px;min-height:60px;}
.k-empty{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:18px 0;}
.k-card{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px 13px;}
.k-card-top{display:flex;align-items:center;justify-content:space-between;}
.k-mesa{font-family:'Fraunces',serif;font-weight:600;font-size:15px;}
.k-time{font-size:11.5px;color:var(--ink-soft);}
.k-mesero{font-size:11.5px;color:var(--ink-soft);margin-top:2px;margin-bottom:8px;}
.k-items{display:flex;flex-direction:column;gap:3px;margin-bottom:6px;}
.k-item{display:flex;justify-content:space-between;font-size:12.5px;gap:8px;align-items:flex-start;}
.k-item span:last-child{color:var(--ink-soft);white-space:nowrap;}
.k-item-note{font-size:11px;font-weight:700;color:var(--gold);margin-top:1px;}
.k-nota{font-size:12px;color:var(--gold);background:color-mix(in srgb, var(--gold) 14%, transparent);padding:6px 8px;border-radius:7px;margin-bottom:8px;}
.k-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;}
.k-total{font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--accent);}
.k-btn{
  border:none;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;
  padding:7px 11px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap;
}
.k-lock-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);
  font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}

/* Bloqueo de cocina por PIN */
.k-lock-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.k-lock-card{width:100%;max-width:320px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 26px;}
.k-lock-icon{font-size:30px;margin-bottom:10px;}
.k-lock-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;}
.k-pin-input{
  width:100%;text-align:center;letter-spacing:10px;font-size:22px;font-weight:700;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:10px;padding:12px;margin-bottom:12px;font-family:inherit;outline:none;
}
.k-pin-input:focus{border-color:var(--accent);}

/* Pantalla de caja */
.caja-wrap{padding:18px 22px 50px;max-width:720px;margin:0 auto;}
.caja-search-row{display:flex;gap:10px;margin-bottom:18px;}
.caja-input{
  flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-family:inherit;font-size:14px;padding:11px 13px;border-radius:9px;outline:none;
}
.caja-input:focus{border-color:var(--accent);}
.caja-btn{
  border:none;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13.5px;
  padding:0 20px;border-radius:9px;cursor:pointer;font-family:inherit;
}
.caja-section-label{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
.caja-tables{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px;}
.caja-chip{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  border:1px solid var(--line);background:var(--surface);border-radius:11px;
  padding:10px 16px;cursor:pointer;font-family:inherit;
}
.caja-chip.active{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, var(--surface));}
.caja-chip-mesa{font-weight:700;font-size:13.5px;}
.caja-chip-total{font-family:'Fraunces',serif;color:var(--accent);font-weight:600;font-size:13px;}
.caja-detail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:420px;}
.caja-detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.caja-order{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:12px;}
.caja-grand{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-top:1px solid var(--line);margin-bottom:14px;}
.caja-grand span:first-child{font-size:13px;color:var(--ink-soft);}
.caja-grand-total{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--accent);}
.caja-confirm{background:color-mix(in srgb, var(--accent) 10%, var(--surface));border:1px solid var(--accent);border-radius:11px;padding:14px;}
.caja-confirm-text{font-size:13.5px;line-height:1.4;margin-bottom:12px;}
.caja-confirm-row{display:flex;gap:10px;}
.caja-confirm-row .send-btn{width:auto;flex:1;padding:12px;}
.caja-btn-ghost{
  flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-weight:700;font-size:13.5px;padding:12px;border-radius:11px;cursor:pointer;font-family:inherit;
}

/* Agotado (carta del cliente) */
.dish.soldout{opacity:.55;}
.soldout-tag{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap;}

/* Panel de administración */
.adm-wrap{max-width:720px;margin:0 auto;padding:18px 16px 130px;display:flex;flex-direction:column;gap:18px;}
.adm-section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;}
.adm-section h3{font-size:17px;font-weight:600;margin-bottom:4px;}
.adm-help{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;line-height:1.45;}
.adm-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.adm-input{
  width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:9px;padding:10px 11px;font-size:14px;font-family:inherit;outline:none;
}
.adm-input:focus{border-color:var(--accent);}
.adm-text{resize:vertical;margin:8px 0 2px;line-height:1.4;}
.adm-x{width:38px;height:38px;flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink-soft);border-radius:9px;cursor:pointer;font-size:14px;}
.adm-add{border:1px dashed var(--line);background:transparent;color:var(--accent);font-weight:700;font-size:13px;padding:10px 14px;border-radius:9px;cursor:pointer;font-family:inherit;width:100%;}
.adm-cat{font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--gold);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.06em;}
.adm-cat:first-of-type{margin-top:0;}
.adm-item{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:12px;margin-bottom:10px;}
.adm-item .adm-input{background:var(--surface);}
.adm-item-top{display:flex;align-items:center;gap:8px;}
.adm-emoji{font-size:20px;}
.adm-price{display:flex;align-items:center;gap:4px;width:96px;flex:0 0 auto;font-weight:700;color:var(--ink-soft);}
.adm-lbl{display:block;font-size:12px;font-weight:700;margin:10px 0 5px;}
.adm-lbl span,.adm-check span{font-weight:400;color:var(--ink-soft);}
.adm-check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-top:10px;cursor:pointer;}
.adm-check input{width:18px;height:18px;accent-color:var(--accent);}
.adm-pinlbl{width:80px;font-size:13.5px;font-weight:700;}
.adm-pin{max-width:110px;letter-spacing:6px;text-align:center;font-weight:700;}
.adm-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);
}
.adm-dirty{font-size:12.5px;font-weight:700;}
.adm-msg{font-size:12px;color:var(--ink-soft);margin-top:2px;max-width:48vw;}
.adm-msg.err{color:var(--accent);}
.adm-msg.ok{color:var(--ok);}
.adm-save{border:none;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px;padding:12px 20px;border-radius:10px;cursor:pointer;font-family:inherit;}
.adm-save:disabled{opacity:.4;cursor:default;}

// Acceso a la configuración editable desde #admin (meseros, precios, PINs…).
// En el demo con base de datos vive en el doc config/main; en la versión de GitHub/Vercel

function cfgStore(db){
  if (window.OrderConfigLocal) return window.OrderConfigLocal;
  return {
    subscribe: function(cb, err){ return db.doc("config/main").onSnapshot(function(s){ cb(s.exists ? s.data() : null); }, err || function(){}); },
    get: function(){ return db.doc("config/main").get().then(function(s){ return s.exists ? s.data() : null; }); },
    set: function(d){ return db.doc("config/main").set(d); }
  };
}

var BASE_MENU = [

function ClienteApp(){
  var MENU = JSON.parse(JSON.stringify(BASE_MENU));

  var RESTAURANT = "Tacos El Buen Sazón";
  var WAITERS = DEFAULT_WAITERS.concat(["No lo sé"]);
  var STATUS_LABEL = { nuevo:"Recibido en cocina", preparando:"Se está preparando", listo:"¡Listo! Tu mesero lo lleva", entregado:"Entregado" };

  // Aplica la configuración guardada desde #admin sobre el menú base (fotos y estructura no cambian).
  function applyConfig(cfg){
    var ov = (cfg && cfg.items) || {};
    MENU.forEach(function(s, si){
      s.items.forEach(function(it, ii){
        var base = BASE_MENU[si].items[ii];
        var o = ov[String(it.id)] || {};
        it.name = o.name ? o.name : base.name;
        it.desc = (typeof o.desc === "string") ? o.desc : base.desc;
        it.price = (typeof o.price === "number" && isFinite(o.price) && o.price >= 0) ? o.price : base.price;
        it.chips = Array.isArray(o.chips) ? o.chips : base.chips;
        it.available = o.available !== false;
      });
    });
    var list = (cfg && Array.isArray(cfg.waiters) && cfg.waiters.length) ? cfg.waiters : DEFAULT_WAITERS;
    WAITERS = list.concat(["No lo sé"]);
  }

  var db = null;
  var dbReady = false;
  if (window.claude && window.claude.use){
    window.claude.use("db").then(function(d){
      db = d; dbReady = true;
      if (db){
        cfgStore(db).subscribe(function(data){
          applyConfig(data);
          render();
        });
      }
      render();
    }).catch(function(){ dbReady = true; render(); });
  } else {
    dbReady = true;
  }

  var orderState = "cart"; // cart | sending | sent | error
  var liveOrder = null; // {folio, status, total, ...}
  var unsubOrder = null;

  function readSession(key){
    try{ return sessionStorage.getItem(key); }catch(e){ return null; }
  }
  function writeSession(key, val){
    try{ sessionStorage.setItem(key, val); }catch(e){}
  }

  var cart = []; // cada línea: {id, qty, note}
  var drawerOpen = false;
  var activeCat = MENU[0].cat;
  var tableNum = readSession("sl_mesa") || "";
  var waiterName = readSession("sl_mesero") || "";
  var onboardOpen = !tableNum; // un solo QR para todo el restaurante: la mesa se captura al abrir
  var onboardErr = "";

  var detailItemId = null; // id del platillo abierto en el modal de detalle/personalización
  var DEFAULT_CHIPS = ["Para llevar"]; // respaldo por si un platillo no trae sus propias opciones

  function submitOnboarding(){
    var tEl = document.getElementById("ob-mesa");
    var wEl = document.getElementById("ob-mesero");
    var t = tEl ? tEl.value.trim() : "";
    var w = wEl ? wEl.value : "";
    if (!t){
      onboardErr = "Escribe el número de tu mesa para continuar.";
      render();
      return;
    }
    tableNum = t;
    waiterName = w || "No lo sé";
    writeSession("sl_mesa", tableNum);
    writeSession("sl_mesero", waiterName);
    slTrack("iniciar_mesa",{mesa:tableNum});
    onboardOpen = false;
    onboardErr = "";
    render();
  }

  function changeTable(){
    onboardOpen = true;
    onboardErr = "";
    render();
  }

  function fmt(n){ return "$" + n.toLocaleString("es-MX"); }

  function findItem(id){
    for (var s=0; s<MENU.length; s++){
      for (var i=0; i<MENU[s].items.length; i++){
        if (MENU[s].items[i].id === id) return MENU[s].items[i];
      }
    }
    return null;
  }

  function cartCount(){
    var n=0; cart.forEach(function(l){ n += l.qty; });
    return n;
  }
  function cartTotal(){
    var t=0; cart.forEach(function(l){ var it=findItem(l.id); if(it) t += it.price*l.qty; });
    return t;
  }

  // La línea "simple" (sin nota) de un platillo — la que controla el +/- rápido en la lista.
  function plainLineIndex(id){
    for (var i=0;i<cart.length;i++){ if (cart[i].id===id && !cart[i].note) return i; }
    return -1;
  }
  function getPlainQty(id){
    var i = plainLineIndex(id);
    return i===-1 ? 0 : cart[i].qty;
  }
  function setPlainQty(id, qty){
    var i = plainLineIndex(id);
    if (qty <= 0){
      if (i!==-1) cart.splice(i,1);
    } else if (i!==-1){
      cart[i].qty = qty;
    } else {
      cart.push({ id: id, qty: qty, note: "" });
    }
    render();
  }

  function setLineQty(idx, qty){
    if (qty <= 0) cart.splice(idx,1); else cart[idx].qty = qty;
    render();
  }

  function addItem(id){
    if (findItem(id).available === false) return;
    setPlainQty(id, getPlainQty(id) + 1);
    showToast(findItem(id).name + " agregado");
    slTrack("agregar_platillo",{item_name:findItem(id).name,price:findItem(id).price,metodo:"rapido"});
  }

  function openDetail(id){
    detailItemId = id;
    render();
  }
  function closeDetail(){
    detailItemId = null;
    render();
  }
  function insertChip(text){
    var el = document.getElementById("detail-note");
    if (!el) return;
    var cur = el.value.trim();
    el.value = cur ? (cur + ", " + text) : text;
  }
  function addFromDetail(id){
    if (findItem(id).available === false){ detailItemId = null; render(); return; }
    var el = document.getElementById("detail-note");
    var note = el ? el.value.trim() : "";
    if (!note){
      setPlainQty(id, getPlainQty(id) + 1);
    } else {
      cart.push({ id: id, qty: 1, note: note });
    }
    detailItemId = null;
    render();
    showToast(findItem(id).name + " agregado");
    slTrack("agregar_platillo",{item_name:findItem(id).name,price:findItem(id).price,metodo:"detalle",con_nota:!!note});
  }

  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById("toast");
    if(!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1600);
  }

  function scrollToCat(cat){
    activeCat = cat;
    var el = document.getElementById("sec-" + cat.replace(/\s+/g,"-"));
    if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
    render();
  }

  function buildOrderItems(){
    return cart.map(function(l){
      var it = findItem(l.id);
      return { name: it.name, qty: l.qty, price: it.price, note: l.note || "" };
    });
  }

  function watchOrder(ref){
    if (unsubOrder) { unsubOrder(); unsubOrder = null; }
    unsubOrder = ref.onSnapshot(function(snap){
      if (!snap.exists) return;
      var d = snap.data();
      liveOrder = {
        id: ref.id,
        folio: ref.id.slice(-4).toUpperCase(),
        status: d.status || "nuevo",
        total: d.total,
        mesa: d.mesa,
        mesero: d.mesero
      };
      render();
    }, function(){ /* se queda con el último estado conocido */ });
  }

  function sendOrder(){
    if (cartCount() === 0) return;
    if (!db){
      orderState = "error";
      render();
      return;
    }
    var noteEl = document.getElementById("order-note");
    var note = noteEl ? noteEl.value.trim() : "";
    var items = buildOrderItems();
    var total = cartTotal();
    orderState = "sending";
    render();

    db.collection("orders").add({
      restaurante: RESTAURANT,
      mesa: tableNum,
      mesero: waiterName,
      items: items,
      total: total,
      nota: note,
      status: "nuevo",
      createdAt: new Date().toISOString()
    }).then(function(ref){
      cart = [];
      orderState = "sent";
      slTrack("enviar_pedido",{value:total,currency:"MXN",articulos:items.reduce(function(s,i){return s+i.qty;},0)});
      watchOrder(ref);
      render();
    }).catch(function(){
      orderState = "error";
      render();
    });
  }

  function newOrder(){
    if (unsubOrder) { unsubOrder(); unsubOrder = null; }
    liveOrder = null;
    orderState = "cart";
    render();
  }

  function openDrawer(){ drawerOpen = true; render(); }
  function closeDrawer(){ drawerOpen = false; render(); }

  function render(){
    var app = document.getElementById("app");

    var railHtml = MENU.map(function(s){
      var cls = "cat-btn" + (s.cat === activeCat ? " active" : "");
      return '<button class="'+cls+"\" onclick='App.scrollToCat("+JSON.stringify(s.cat)+")'>"+s.cat+'</button>';
    }).join("");

    var sectionsHtml = MENU.map(function(s){
      var dishesHtml = s.items.map(function(it){
        var qty = getPlainQty(it.id);
        var sold = it.available === false;
        var controlHtml = sold
          ? '<span class="soldout-tag">Agotado</span>'
          : qty > 0
          ? '<div class="qty-control">'
            + '<button class="qty-btn" onclick="App.setPlainQty('+it.id+','+(qty-1)+')">&minus;</button>'
            + '<span class="qty-val">'+qty+'</span>'
            + '<button class="qty-btn" onclick="App.setPlainQty('+it.id+','+(qty+1)+')">+</button>'
            + '</div>'
          : '<button class="add-btn" aria-label="Agregar" onclick="App.addItem('+it.id+')">+</button>';
        var thumbHtml = it.photo
          ? '<img class="dish-photo" src="'+it.photo+'" alt="'+it.name+'" loading="lazy">'
          : '<div class="dish-photo" style="display:flex;align-items:center;justify-content:center;font-size:28px;">'+it.emoji+'</div>';
        return '<div class="dish'+(sold?' soldout':'')+'">'
          + thumbHtml
          + '<div class="dish-info">'
            + '<div class="dish-name">'+it.name+'</div>'
            + '<div class="dish-desc">'+it.desc+'</div>'
            + (sold ? '' : '<button class="dish-custom-link" onclick="App.openDetail('+it.id+')">Ver detalle / pedir sin algo →</button>')
            + '<div class="dish-bottom"><span class="dish-price">'+fmt(it.price)+'</span>'+controlHtml+'</div>'
          + '</div>'
        + '</div>';
      }).join("");
      return '<div class="section" id="sec-'+s.cat.replace(/\s+/g,"-")+'">'
        + '<div class="section-head"><h3 class="section-title">'+s.cat+'</h3><span class="count">'+s.items.length+' platillos</span></div>'
        + dishesHtml
      + '</div>';
    }).join("");

    var count = cartCount();
    var total = cartTotal();

    var cartRowsHtml = cart.map(function(l, idx){
      var it = findItem(l.id);
      if (!it) return "";
      var cartThumb = it.photo
        ? '<img src="'+it.photo+'" alt="" style="width:34px;height:34px;border-radius:7px;object-fit:cover;flex-shrink:0;">'

function CocinaApp(){
  var STATUS_LABEL = { nuevo:"Nuevo", preparando:"Preparando", listo:"Listo", entregado:"Entregado" };
  var NEXT_STATUS = { nuevo:"preparando", preparando:"listo", listo:"entregado" };
  var NEXT_LABEL = { nuevo:"Empezar a preparar", preparando:"Marcar listo", listo:"Marcar entregado" };
  var cfg = null; // configuración guardada desde #admin (PIN, etc.)
  function currentPin(){ return (cfg && cfg.pins && cfg.pins.cocina) || DEFAULT_PINS.cocina; }

  var db = null;
  var orders = [];
  var loaded = false;
  var unsub = null;
  var tickTimer = null;

  function readLocal(key){
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  function writeLocal(key, val){
    try{ localStorage.setItem(key, val); }catch(e){}
  }

  // El dispositivo queda desbloqueado solo mientras el PIN guardado coincida con el PIN vigente.
  var locked = readLocal("sl_cocina_unlocked") !== currentPin();
  var pinError = "";

  function submitPin(){
    var el = document.getElementById("pin-input");
    var val = el ? el.value.trim() : "";
    if (val === currentPin()){
      writeLocal("sl_cocina_unlocked", currentPin());
      slTrack("desbloquear_pantalla",{pantalla:"cocina"});
      locked = false;
      pinError = "";
      render();
      if (db) startWatch();
    } else {
      pinError = "PIN incorrecto. Intenta de nuevo.";
      render();
    }
  }

  function lockScreen(){
    locked = true;
    if (unsub){ unsub(); unsub = null; }
    render();
  }

  function fmt(n){ return "$" + (n||0).toLocaleString("es-MX"); }

  function minsAgo(iso){
    var d = new Date(iso).getTime();
    if (!d) return "";
    var m = Math.max(0, Math.round((Date.now() - d) / 60000));
    return m <= 0 ? "ahora" : (m + " min");
  }

  function advance(id, current){
    var next = NEXT_STATUS[current];
    if (!next || !db) return;
    slTrack("cambiar_estado",{estado:next});
    db.doc("orders/" + id).update({ status: next }).catch(function(){});
  }

  function startWatch(){
    if (!db) return;
    if (unsub){ unsub(); unsub = null; }
    unsub = db.collection("orders")
      .orderBy("createdAt", "asc")
      .limit(100)
      .onSnapshot(function(snap){
        orders = snap.docs
          .map(function(d){ return Object.assign({ id: d.id }, d.data()); })
          .filter(function(o){ var s = o.status || "nuevo"; return s !== "entregado" && s !== "cobrado"; });
        loaded = true;
        render();
      }, function(){ loaded = true; render(); });
  }

  function render(){
    var app = document.getElementById("app");

    if (locked){
      app.innerHTML =
        '<div class="k-lock-wrap">'
          + '<div class="k-lock-card">'
            + '<div class="k-lock-icon">🔒</div>'
            + '<h2 class="font-display">Pantalla de cocina</h2>'
            + '<div class="k-lock-sub">Tacos El Buen Sazón &middot; acceso solo para personal</div>'
            + (window.OrderSislandDemo && currentPin() === DEFAULT_PINS.cocina ? '<div class="k-lock-sub" style="margin-top:-12px">PIN de demostración: <b>'+currentPin()+'</b></div>' : '')
            + (pinError ? '<div class="onboard-err" style="display:block;">'+pinError+'</div>' : '')
            + '<input id="pin-input" class="k-pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="····" onkeydown="if(event.key===\'Enter\')App.submitPin()">'
            + '<button class="onboard-go" onclick="App.submitPin()">Entrar</button>'
          + '</div>'
        + '</div>';
      return;
    }

    var cols = ["nuevo", "preparando", "listo"];

    var colsHtml = cols.map(function(status){
      var list = orders.filter(function(o){ return (o.status || "nuevo") === status; });
      var cardsHtml = list.length ? list.map(function(o){
        var itemsHtml = (o.items || []).map(function(it){
          return '<div class="k-item"><span>'+it.qty+'x '+it.name+(it.note?'<div class="k-item-note">'+it.note+'</div>':'')+'</span><span>'+fmt(it.price*it.qty)+'</span></div>';
        }).join("");
        return '<div class="k-card">'
          + '<div class="k-card-top"><span class="k-mesa">Mesa '+(o.mesa||"—")+'</span><span class="k-time">'+minsAgo(o.createdAt)+'</span></div>'
          + '<div class="k-mesero">Atiende: '+(o.mesero||"—")+' &middot; folio #'+o.id.slice(-4).toUpperCase()+'</div>'
          + '<div class="k-items">'+itemsHtml+'</div>'
          + (o.nota ? '<div class="k-nota">Nota: '+o.nota+'</div>' : '')
          + '<div class="k-bottom"><span class="k-total">'+fmt(o.total)+'</span>'
            + (NEXT_STATUS[status] ? "<button class=\"k-btn\" onclick='App.advance("+JSON.stringify(o.id)+","+JSON.stringify(status)+")'>"+NEXT_LABEL[status]+' →</button>' : '')
          + '</div>'
        + '</div>';
      }).join("") : '<div class="k-empty">Sin pedidos</div>';
      return '<div class="k-col"><div class="k-col-head"><span>'+STATUS_LABEL[status]+'</span><span class="k-count">'+list.length+'</span></div><div class="k-col-body">'+cardsHtml+'</div></div>';
    }).join("");

    app.innerHTML =
      '<div class="k-header">'
        + '<div><div class="k-title font-display">Cocina · Tacos El Buen Sazón</div><div class="k-sub">Pantalla en vivo de pedidos</div></div>'
        + '<div style="display:flex;align-items:center;gap:14px;">'
          + '<div class="k-live">'+(db ? '🟢 En vivo' : (loaded ? '⚪ Sin conexión' : '… conectando'))+'</div>'
          + '<button class="k-lock-btn" onclick="App.lockScreen()" title="Bloquear pantalla">🔒</button>'
        + '</div>'
      + '</div>'
      + '<div class="k-board">'+colsHtml+'</div>';
  }

  function watchConfig(KEY){
    var first = true;
    cfgStore(db).subscribe(function(data){
      cfg = data;
      var ok = readLocal(KEY) === currentPin();
      if (first){
        first = false;
        if (ok && locked){ locked = false; startWatch(); return; }
      }
      if (!ok && !locked){ lockScreen(); return; }
      render();
    }, function(){});
  }
  if (window.claude && window.claude.use){
    window.claude.use("db").then(function(d){
      db = d; loaded = true;
      if (db && !locked) startWatch(); else render();
      if (db) watchConfig("sl_cocina_unlocked");
    }).catch(function(){ loaded = true; render(); });
  } else {
    loaded = true;
  }

  window.App = { advance: advance, submitPin: submitPin, lockScreen: lockScreen };
  tickTimer = setInterval(render, 30000);
  render();
}

function CajaApp(){
  var RESTAURANT = "Tacos El Buen Sazón";
  var cfg = null; // configuración guardada desde #admin (PIN, etc.)
  function currentPin(){ return (cfg && cfg.pins && cfg.pins.caja) || DEFAULT_PINS.caja; }
  var STATUS_LABEL = { nuevo:"Nuevo", preparando:"Preparando", listo:"Listo", entregado:"Entregado" };

  var db = null;
  var orders = [];
  var loaded = false;
  var unsub = null;
  var selectedMesa = null;
  var chargeBusy = false;
  var confirmingCharge = false;
  var payMethod = "efectivo";
  function setPay(m){ payMethod = m; render(); }

  function readLocal(key){
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  function writeLocal(key, val){
    try{ localStorage.setItem(key, val); }catch(e){}
  }

  var locked = readLocal("sl_caja_unlocked") !== currentPin();
  var pinError = "";

  function submitPin(){
    var el = document.getElementById("pin-input");
    var val = el ? el.value.trim() : "";
    if (val === currentPin()){
      writeLocal("sl_caja_unlocked", currentPin());
      slTrack("desbloquear_pantalla",{pantalla:"caja"});
      locked = false;
      pinError = "";
      render();
      if (db) startWatch();
    } else {
      pinError = "PIN incorrecto. Intenta de nuevo.";
      render();
    }
  }

  function lockScreen(){
    locked = true;
    selectedMesa = null;
    if (unsub){ unsub(); unsub = null; }
    render();
  }

  function fmt(n){ return "$" + (n||0).toLocaleString("es-MX"); }

  function minsAgo(iso){
    var d = new Date(iso).getTime();
    if (!d) return "";
    var m = Math.max(0, Math.round((Date.now() - d) / 60000));
    return m <= 0 ? "ahora" : (m + " min");
  }

  function startWatch(){
    if (!db) return;
    if (unsub){ unsub(); unsub = null; }
    unsub = db.collection("orders")
      .orderBy("createdAt", "asc")
      .limit(200)
      .onSnapshot(function(snap){
        orders = snap.docs
          .map(function(d){ return Object.assign({ id: d.id }, d.data()); })
          .filter(function(o){ return (o.status || "nuevo") !== "cobrado"; });
        loaded = true;
        render();
      }, function(){ loaded = true; render(); });
  }

  function tablesSummary(){
    var map = {};
    orders.forEach(function(o){
      var mesa = o.mesa || "—";
      if (!map[mesa]) map[mesa] = { mesa: mesa, total: 0, count: 0, lastAt: o.createdAt };
      map[mesa].total += (o.total || 0);
      map[mesa].count += 1;
      if (o.createdAt && (!map[mesa].lastAt || o.createdAt > map[mesa].lastAt)) map[mesa].lastAt = o.createdAt;
    });
    return Object.keys(map).map(function(k){ return map[k]; })
      .sort(function(a,b){ return (a.lastAt||"") < (b.lastAt||"") ? 1 : -1; });
  }

  function searchMesa(){
    var el = document.getElementById("caja-mesa-input");
    var val = el ? el.value.trim() : "";
    if (!val) return;
    selectMesa(val);
  }

  function selectMesa(mesa){
    selectedMesa = String(mesa);
    confirmingCharge = false;
    render();
  }

  function clearSelection(){
    selectedMesa = null;
    confirmingCharge = false;
    render();
  }

  function askCharge(){ payMethod = "efectivo";
    confirmingCharge = true;
    render();
  }

  function cancelCharge(){
    confirmingCharge = false;
    render();
  }

  function chargeMesa(mesa){
    if (!db || chargeBusy) return;
    var list = orders.filter(function(o){ return String(o.mesa) === String(mesa); });
    if (!list.length) return;
    slTrack("cobrar_mesa",{value:list.reduce(function(s,o){return s+(o.total||0);},0),currency:"MXN",pago:payMethod});
    confirmingCharge = false;
    chargeBusy = true;
    render();
    Promise.all(list.map(function(o){
      return db.doc("orders/" + o.id).update({ status: "cobrado", cobradoAt: new Date().toISOString(), pago: payMethod }).catch(function(){});
    })).then(function(){
      chargeBusy = false;
      selectedMesa = null;
      render();
    });
  }

  function render(){
    var app = document.getElementById("app");

    if (locked){
      app.innerHTML =
        '<div class="k-lock-wrap">'
          + '<div class="k-lock-card">'
            + '<div class="k-lock-icon">💰</div>'
            + '<h2 class="font-display">Caja</h2>'
            + '<div class="k-lock-sub">'+RESTAURANT+' &middot; acceso solo para caja/gerencia</div>'
            + (window.OrderSislandDemo && currentPin() === DEFAULT_PINS.caja ? '<div class="k-lock-sub" style="margin-top:-12px">PIN de demostración: <b>'+currentPin()+'</b></div>' : '')
            + (pinError ? '<div class="onboard-err" style="display:block;">'+pinError+'</div>' : '')
            + '<input id="pin-input" class="k-pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="····" onkeydown="if(event.key===\'Enter\')App.submitPin()">'
            + '<button class="onboard-go" onclick="App.submitPin()">Entrar</button>'
          + '</div>'
        + '</div>';
      return;
    }

    var tables = tablesSummary();

    var tablesHtml = tables.length ? tables.map(function(t){
      var active = selectedMesa === String(t.mesa);
      return '<button class="caja-chip'+(active?" active":"")+"\" onclick='App.selectMesa("+JSON.stringify(t.mesa)+")'>"
        + '<span class="caja-chip-mesa">Mesa '+t.mesa+'</span>'
        + '<span class="caja-chip-total">'+fmt(t.total)+'</span>'
      + '</button>';
    }).join("") : '<div class="k-empty">No hay cuentas abiertas</div>';

    var detailHtml = "";
    if (selectedMesa){
      var list = orders.filter(function(o){ return String(o.mesa) === String(selectedMesa); });
      if (!list.length){
        detailHtml = '<div class="caja-detail"><div class="k-empty">Esta mesa ya no tiene cuenta abierta.</div></div>';
      } else {
        var grand = 0;
        var ordersHtml = list.map(function(o){
          grand += (o.total || 0);
          var itemsHtml = (o.items||[]).map(function(it){
            return '<div class="k-item"><span>'+it.qty+'x '+it.name+(it.note?'<div class="k-item-note">'+it.note+'</div>':'')+'</span><span>'+fmt(it.price*it.qty)+'</span></div>';
          }).join("");
          return '<div class="caja-order">'
            + '<div class="k-card-top"><span class="k-mesa">Folio #'+o.id.slice(-4).toUpperCase()+' &middot; '+STATUS_LABEL[o.status||"nuevo"]+'</span><span class="k-time">'+minsAgo(o.createdAt)+'</span></div>'
            + '<div class="k-mesero">Atiende: '+(o.mesero||"—")+'</div>'
            + '<div class="k-items">'+itemsHtml+'</div>'
            + (o.nota ? '<div class="k-nota">Nota: '+o.nota+'</div>' : '')
            + '<div class="k-bottom"><span></span><span class="k-total">'+fmt(o.total)+'</span></div>'
          + '</div>';
        }).join("");
        var actionHtml;
        if (chargeBusy){
          actionHtml = '<button class="send-btn" disabled style="opacity:.5;">Procesando…</button>';
        } else if (confirmingCharge){
          actionHtml =
            '<div class="caja-confirm">'
              + '<div class="caja-confirm-text">¿Cómo pagó la mesa '+selectedMesa+'? Total: <b>'+fmt(grand)+'</b>. Al confirmar se cerrará su cuenta.</div>'
              + '<div class="pay-row">'+[["efectivo","Efectivo"],["tarjeta","Tarjeta"],["transferencia","Transferencia"]].map(function(p){ return "<button class=\"pay-btn"+(payMethod===p[0]?" on":"")+"\" onclick=\"App.setPay('"+p[0]+"')\">"+p[1]+"</button>"; }).join("")+'</div>'
              + '<div class="caja-confirm-row">'
                + '<button class="caja-btn-ghost" onclick="App.cancelCharge()">Cancelar</button>'
                + "<button class=\"send-btn\" onclick='App.chargeMesa("+JSON.stringify(selectedMesa)+")'>Sí, ya pagó</button>"
              + '</div>'
            + '</div>';
        } else {
          actionHtml = '<button class="send-btn" onclick="App.askCharge()">Marcar cuenta como cobrada</button>';
        }

function AdminApp(){

  function readLocal(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
  function writeLocal(key, val){ try{ localStorage.setItem(key, val); }catch(e){} }
  function currentPin(){ return (cfg && cfg.pins && cfg.pins.admin) || DEFAULT_PINS.admin; }
  var locked = readLocal("sl_admin_unlocked") !== currentPin();
  function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

    var pins = draft.pins;

    }
    var items = {};
    var bad = null;
    BASE_MENU.forEach(function(s){ s.items.forEach(function(b){
      var d = draft.items[b.id];
      var name = d.name.trim();

      var chips = d.chipsText.split(",").map(function(c){ return c.trim(); }).filter(Boolean).slice(0,12);
      items[String(b.id)] = { name:name, desc:d.desc.trim(), price:price, chips:chips, available:!!d.available };
    }); });
    if (bad) return { err:bad };
    return { data:{ waiters:w, pins:{ cocina:pins.cocina, caja:pins.caja, admin:pins.admin }, items:items, updatedAt:new Date().toISOString() } };
  }

  function save(){
    if (saving || !dirty) return;

    if (v.err){ msg = v.err; msgKind = "err"; paintMsg(); return; }

    saving = true; msg = "Guardando…"; msgKind = ""; paintMsg(); setDirty(true);
    cfgStore(db).set(v.data).then(function(){
      saving = false;
      // Si cambió el PIN de admin, este dispositivo sigue desbloqueado.
      writeLocal("sl_admin_unlocked", v.data.pins.admin);
      cfg = v.data;
      msg = "Cambios guardados. Los clientes y la cocina ya los ven."; msgKind = "ok";
      slTrack("guardar_admin");

        + (window.OrderSislandDemo && currentPin() === DEFAULT_PINS.admin ? '<div class="k-lock-sub" style="margin-top:-12px">PIN de demostración: <b>'+currentPin()+'</b></div>' : '')
        + (pinError ? '<div class="onboard-err" style="display:block;">' + pinError + '</div>' : '')
        + '<input id="pin-input" class="k-pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="····" onkeydown="if(event.key===\'Enter\')App.submitPin()">'
        + '<button class="onboard-go" onclick="App.submitPin()">Entrar</button>'

    var wHtml = draft.waiters.map(function(w, i){

        + '<button class="adm-x" data-delw="' + i + '" title="Quitar">✕</button></div>';
    }).join("");

    var mHtml = BASE_MENU.map(function(s){
      return '<div class="adm-cat">' + esc(s.cat) + '</div>' + s.items.map(function(b){
        var d = draft.items[b.id];
        return '<div class="adm-item">'
          + '<div class="adm-item-top"><span class="adm-emoji">' + b.emoji + '</span>'
          + '<input class="adm-input" data-f="name" data-id="' + b.id + '" value="' + esc(d.name) + '" maxlength="60" aria-label="Nombre">'
          + '<div class="adm-price"><span>$</span><input class="adm-input" data-f="price" data-id="' + b.id + '" value="' + esc(d.price) + '" inputmode="decimal" aria-label="Precio"></div></div>'
          + '<textarea class="adm-input adm-text" data-f="desc" data-id="' + b.id + '" rows="2" maxlength="220" placeholder="Descripción (ingredientes, qué es…)">' + esc(d.desc) + '</textarea>'
          + '<label class="adm-lbl">Opciones para el cliente <span>(separadas por coma)</span></label>'
          + '<input class="adm-input" data-f="chipsText" data-id="' + b.id + '" value="' + esc(d.chipsText) + '" placeholder="Sin cebolla, Sin cilantro, Sin salsa">'
          + '<label class="adm-check"><input type="checkbox" data-f="available" data-id="' + b.id + '"' + (d.available ? ' checked' : '') + '> Disponible hoy <span>(desmárcalo si se agotó)</span></label>'
          + '</div>';
      }).join("");
    }).join("");

    app.innerHTML =
      '<div class="k-header"><div><div class="k-title font-display">Administración · ' + RESTAURANT + '</div><div class="k-sub">Meseros, precios y disponibilidad</div></div>'
      + '<button class="k-lock-btn" data-act="lock" title="Bloquear">🔒</button></div>'
      + '<div class="adm-wrap">'

      + wHtml + '<button class="adm-add" data-act="addw">+ Agregar mesero</button></div>'
      + '<div class="adm-section"><h3 class="font-display">Platillos</h3><div class="adm-help">Cambia nombre, precio, descripción u opciones de lo que ya está en la carta. Para agregar platillos nuevos o fotos, es parte del servicio de mantenimiento.</div>' + mHtml + '</div>'
      + '<div class="adm-section"><h3 class="font-display">Accesos (PIN)</h3><div class="adm-help">4 números. Si cambias un PIN, los dispositivos que lo tenían guardado lo volverán a pedir.</div>'
      + ['cocina','caja','admin'].map(function(k){
          return '<div class="adm-row"><label class="adm-pinlbl">' + k.charAt(0).toUpperCase() + k.slice(1) + '</label><input class="adm-input adm-pin" data-pin="' + k + '" value="' + esc(draft.pins[k]) + '" maxlength="4" inputmode="numeric"></div>';
        }).join("")
      + '</div></div>'
      + '<div class="adm-bar"><div><div id="adm-dirty" class="adm-dirty">' + (dirty ? 'Cambios sin guardar' : 'Todo guardado') + '</div><div id="adm-msg" class="adm-msg ' + msgKind + '">' + esc(msg) + '</div></div>'
      + '<button id="adm-save" class="adm-save" data-act="save"' + ((!dirty || saving) ? ' disabled' : '') + '>Guardar cambios</button></div>';
  }

  var root = document.getElementById("app");
  root.addEventListener("input", function(e){
    var t = e.target;
    if (t.getAttribute("data-w") !== null){ draft.waiters[Number(t.getAttribute("data-w"))] = t.value; setDirty(true); return; }
    if (t.getAttribute("data-pin")){ draft.pins[t.getAttribute("data-pin")] = t.value.trim(); setDirty(true); return; }
    var f = t.getAttribute("data-f"), id = t.getAttribute("data-id");
    if (f && id && f !== "available"){ draft.items[id][f] = t.value; setDirty(true); }
  });
  root.addEventListener("change", function(e){
    var t = e.target;
    if (t.getAttribute("data-f") === "available"){ draft.items[t.getAttribute("data-id")].available = t.checked; setDirty(true); }
  });
  root.addEventListener("click", function(e){
    var t = e.target.closest ? e.target.closest("[data-act],[data-delw]") : null;
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (act === "lock") return lockScreen();
    if (act === "save") return save();
    if (act === "addw"){ draft.waiters.push(""); setDirty(true); render(); var ins = root.querySelectorAll("[data-w]"); if (ins.length) ins[ins.length-1].focus(); return; }
    if (t.getAttribute("data-delw") !== null){ draft.waiters.splice(Number(t.getAttribute("data-delw")),1); setDirty(true); render(); }

        draft = null; render();
      }).catch(function(){ render(); });

// ============================================================
//  VENTAS Y CORTE DE CAJA  (#ventas) — acceso con PIN de admin
//  Historial de cuentas cobradas por día/rango, desglose por
//  forma de pago, mesero, platillo y hora; corte de caja con
//  efectivo contado vs. esperado; exportación a CSV (Excel).
// ============================================================
function VentasApp(){
  var RESTAURANT = "Tacos El Buen Sazón";
  var db = null, cfg = null, loaded = false;
  var orders = [], cortes = [];
  var unsubO = null, unsubC = null;
  var pinError = "";
  function readLocal(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
  function writeLocal(key, val){ try{ localStorage.setItem(key, val); }catch(e){} }
  function currentPin(){ return (cfg && cfg.pins && cfg.pins.admin) || DEFAULT_PINS.admin; }
  var locked = readLocal("sl_admin_unlocked") !== currentPin();
  function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function fmt(n){ var v=Math.round((n||0)*100)/100; return "$" + v.toLocaleString("es-MX",{minimumFractionDigits: v%1?2:0, maximumFractionDigits:2}); }
  function pad(n){ return (n<10?"0":"")+n; }
  function dayKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseDay(k){ var p=k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(k, n){ var d=parseDay(k); d.setDate(d.getDate()+n); return dayKey(d); }
  function niceDay(k){ var d=parseDay(k); return d.toLocaleDateString("es-MX",{weekday:"long", day:"numeric", month:"long"}); }
  function hhmm(iso){ var d=new Date(iso); return isNaN(d) ? "—" : pad(d.getHours())+":"+pad(d.getMinutes()); }
  var PAGO_LABEL = { efectivo:"Efectivo", tarjeta:"Tarjeta", transferencia:"Transferencia", "":"Sin especificar" };

  var today = dayKey(new Date());
  var from = today, to = today;
  var corte = { fondo:"", contado:"", responsable:"", saving:false, msg:"", kind:"" };

  function submitPin(){
    var el = document.getElementById("pin-input");
    var val = el ? el.value.trim() : "";
    if (val === currentPin()){
      writeLocal("sl_admin_unlocked", currentPin());
      if (typeof slTrack === "function") slTrack("desbloquear_pantalla",{pantalla:"ventas"});
      locked = false; pinError = ""; startWatch(); render();
    } else { pinError = "PIN incorrecto. Intenta de nuevo."; render(); }
  }
  function lockScreen(){ locked = true; stopWatch(); render(); }

  function startWatch(){
    if (!db) return;
    stopWatch();
    unsubO = db.collection("orders").orderBy("createdAt","asc").limit(5000).onSnapshot(function(snap){
      orders = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function(){});
    unsubC = db.collection("cortes").orderBy("createdAt","desc").limit(500).onSnapshot(function(snap){
      cortes = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function(){});
  }
  function stopWatch(){ if (unsubO){ unsubO(); unsubO=null; } if (unsubC){ unsubC(); unsubC=null; } }

  // ---- data ----
  function paidAt(o){ return o.cobradoAt || o.createdAt; }
  function inRange(iso){ var d=new Date(iso); if (isNaN(d)) return false; var k=dayKey(d); return k>=from && k<=to; }
  function sales(){ return orders.filter(function(o){ return o.status === "cobrado" && inRange(paidAt(o)); }).sort(function(a,b){ return paidAt(a) < paidAt(b) ? -1 : 1; }); }
  function openNow(){ return orders.filter(function(o){ return o.status !== "cobrado"; }); }
  function summary(list){
    var s = { total:0, n:list.length, pago:{}, mesero:{}, platillo:{}, hora:{} };
    list.forEach(function(o){
      var t = o.total||0; s.total += t;
      var p = o.pago || ""; s.pago[p] = (s.pago[p]||0) + t;
      var m = o.mesero || "—"; s.mesero[m] = s.mesero[m] || { total:0, n:0 }; s.mesero[m].total += t; s.mesero[m].n++;
      (o.items||[]).forEach(function(it){ var k=it.name; s.platillo[k] = s.platillo[k] || { qty:0, total:0 }; s.platillo[k].qty += it.qty; s.platillo[k].total += it.qty*it.price; });
      var h = new Date(paidAt(o)).getHours(); s.hora[h] = (s.hora[h]||0) + t;
    });
    return s;
  }

  // ---- actions ----
  function setRange(a, b){ from = a; to = b || a; corte.msg = ""; render(); }
  function quick(kind){
    if (kind === "hoy") setRange(today);
    else if (kind === "ayer") setRange(addDays(today,-1));
    else if (kind === "7") setRange(addDays(today,-6), today);
    else if (kind === "mes"){ var d=parseDay(today); setRange(dayKey(new Date(d.getFullYear(), d.getMonth(), 1)), today); }
  }
  function onDate(which, val){ if (!val) return; if (which==="from"){ from=val; if (to<from) to=from; } else { to=val; if (from>to) from=to; } corte.msg=""; render(); }
  function setField(k, v){ corte[k] = v; paintCorte(); }

  function cashExpected(list){ return list.filter(function(o){ return (o.pago||"") === "efectivo"; }).reduce(function(s,o){ return s+(o.total||0); },0); }
  function saveCorte(){
    if (corte.saving || from !== to) return;
    var list = sales();
    var fondo = Number(corte.fondo||0), contado = Number(corte.contado);
    if (corte.contado === "" || !isFinite(contado)){ corte.msg="Escribe el efectivo que contaste en caja."; corte.kind="err"; render(); return; }
    if (!isFinite(fondo) || fondo < 0){ corte.msg="El fondo inicial no es válido."; corte.kind="err"; render(); return; }
    var s = summary(list), esperado = fondo + cashExpected(list);
    corte.saving = true; render();
    db.collection("cortes").add({
      dia: from, createdAt: new Date().toISOString(), responsable: (corte.responsable||"").trim() || "Sin nombre",
      fondo: fondo, efectivoVentas: cashExpected(list), esperado: esperado, contado: contado, diferencia: contado - esperado,
      totalVentas: s.total, cuentas: s.n, porPago: s.pago
    }).then(function(){
      if (typeof slTrack === "function") slTrack("guardar_corte",{value:s.total,currency:"MXN"});
      corte = { fondo:"", contado:"", responsable:corte.responsable, saving:false, msg:"Corte guardado. Puedes consultarlo cuando quieras en este mismo día.", kind:"ok" };
      render();
    }).catch(function(){ corte.saving=false; corte.msg="No se pudo guardar el corte. Inténtalo de nuevo."; corte.kind="err"; render(); });
  }
  function exportCSV(){
    var list = sales();
    var rows = [["Fecha","Hora de cobro","Folio","Mesa","Mesero","Forma de pago","Platillo","Cantidad","Precio unitario","Importe","Nota del pedido","Total de la cuenta"]];
    list.forEach(function(o){
      var d = new Date(paidAt(o));
      (o.items||[]).forEach(function(it, i){
        rows.push([dayKey(d), hhmm(paidAt(o)), "#"+o.id.slice(-4).toUpperCase(), o.mesa, o.mesero||"", PAGO_LABEL[o.pago||""], it.name+(it.note?" ("+it.note+")":""), it.qty, it.price, it.qty*it.price, i===0?(o.nota||""):"", i===0?(o.total||0):""]);
      });
    });
    var csv = "﻿" + rows.map(function(r){ return r.map(function(c){ c=String(c==null?"":c); return /[",\n;]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c; }).join(","); }).join("\r\n");
    var blob = new Blob([csv], { type:"text/csv;charset=utf-8" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "ventas_" + (from===to ? from : from+"_a_"+to) + ".csv";
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    if (typeof slTrack === "function") slTrack("exportar_ventas",{dias: from===to?1:2});
  }

  // ---- view ----
  function paintCorte(){
    var el = document.getElementById("v-corte-calc"); if (!el) return;
    el.innerHTML = corteCalcHtml(sales());
  }
  function corteCalcHtml(list){
    var fondo = Number(corte.fondo||0); var ventasEf = cashExpected(list); var esperado = (isFinite(fondo)?fondo:0) + ventasEf;
    var hasC = corte.contado !== "" && isFinite(Number(corte.contado)); var dif = hasC ? Number(corte.contado) - esperado : null;
    return '<div class="v-row"><span>Fondo inicial</span><b>'+fmt(isFinite(fondo)?fondo:0)+'</b></div>'
      + '<div class="v-row"><span>Ventas en efectivo</span><b>'+fmt(ventasEf)+'</b></div>'
      + '<div class="v-row v-strong"><span>Efectivo esperado en caja</span><b>'+fmt(esperado)+'</b></div>'
      + (hasC ? '<div class="v-row v-strong"><span>Diferencia</span><b class="'+(Math.abs(dif)<0.005?'v-ok':(dif>0?'v-plus':'v-minus'))+'">'+(Math.abs(dif)<0.005?'Cuadra exacto':(dif>0?'Sobran ':'Faltan ')+fmt(Math.abs(dif)))+'</b></div>' : '');
  }
  function render(){
    var app = document.getElementById("app");
    if (locked){
      app.innerHTML =
        '<div class="k-lock-wrap"><div class="k-lock-card">'
          + '<div class="k-lock-icon">📊</div><h2 class="font-display">Ventas y corte de caja</h2>'
          + '<div class="k-lock-sub">'+RESTAURANT+' &middot; acceso solo para gerencia</div>'
          + (window.OrderSislandDemo && currentPin() === DEFAULT_PINS.admin ? '<div class="k-lock-sub" style="margin-top:-12px">PIN de demostración: <b>'+currentPin()+'</b></div>' : '')
          + (pinError ? '<div class="onboard-err" style="display:block;">'+pinError+'</div>' : '')
          + '<input id="pin-input" class="k-pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="····" onkeydown="if(event.key===\'Enter\')App.submitPin()">'
          + '<button class="onboard-go" onclick="App.submitPin()">Entrar</button>'
        + '</div></div>';
      return;
    }
    var list = sales(), s = summary(list), single = from === to;
    var avg = s.n ? s.total / s.n : 0;
    var open = openNow(); var openTotal = open.reduce(function(a,o){ return a+(o.total||0); },0);
    var rangeLabel = single ? niceDay(from) : (niceDay(from) + " — " + niceDay(to)); rangeLabel = rangeLabel.charAt(0).toUpperCase() + rangeLabel.slice(1);
    var isQ = function(k){ return (k==="hoy"&&single&&from===today)||(k==="ayer"&&single&&from===addDays(today,-1))||(k==="7"&&from===addDays(today,-6)&&to===today); };

    var pagoHtml = ["efectivo","tarjeta","transferencia",""].filter(function(p){ return s.pago[p] || p!==""; }).map(function(p){
      var v = s.pago[p]||0; var pct = s.total ? Math.round(v*100/s.total) : 0;
      return '<div class="v-bar-row"><span class="v-bar-lbl">'+PAGO_LABEL[p]+'</span><div class="v-bar"><i style="width:'+pct+'%"></i></div><b>'+fmt(v)+'</b></div>';
    }).join("");
    var meseros = Object.keys(s.mesero).sort(function(a,b){ return s.mesero[b].total - s.mesero[a].total; });
    var meseroHtml = meseros.length ? meseros.map(function(m){ return '<div class="v-row"><span>'+esc(m)+' <small>· '+s.mesero[m].n+' cuenta'+(s.mesero[m].n===1?'':'s')+'</small></span><b>'+fmt(s.mesero[m].total)+'</b></div>'; }).join("") : '<div class="k-empty">Sin ventas en este periodo</div>';
    var plat = Object.keys(s.platillo).sort(function(a,b){ return s.platillo[b].qty - s.platillo[a].qty; }).slice(0,8);
    var maxQ = plat.length ? s.platillo[plat[0]].qty : 1;
    var platHtml = plat.length ? plat.map(function(p,i){ return '<div class="v-bar-row"><span class="v-bar-lbl">'+(i+1)+'. '+esc(p)+'</span><div class="v-bar"><i style="width:'+Math.round(s.platillo[p].qty*100/maxQ)+'%"></i></div><b>'+s.platillo[p].qty+'</b></div>'; }).join("") : '<div class="k-empty">Sin ventas en este periodo</div>';
    var horas = Object.keys(s.hora).map(Number).sort(function(a,b){return a-b;});
    var maxH = horas.reduce(function(m,h){ return Math.max(m, s.hora[h]); }, 1);
    var horaHtml = horas.length ? '<div class="v-hours">' + horas.map(function(h){ return '<div class="v-hcol" title="'+fmt(s.hora[h])+'"><div class="v-hbar" style="height:'+Math.max(6,Math.round(s.hora[h]*100/maxH))+'%"></div><span>'+pad(h)+'h</span></div>'; }).join("") + '</div>' : '<div class="k-empty">Sin ventas en este periodo</div>';
    var MAXL = 60; var shown = list.slice().reverse().slice(0, MAXL);
    var cuentasHtml = list.length ? shown.map(function(o){
      var its = (o.items||[]).map(function(it){ return it.qty+'x '+esc(it.name); }).join(", ");
      return '<div class="v-ticket"><div class="v-ticket-top"><b>Mesa '+esc(o.mesa)+'</b><span>'+(single?'':dayKey(new Date(paidAt(o))).slice(5)+' · ')+hhmm(paidAt(o))+'</span></div>'
        + '<div class="v-ticket-sub">Folio #'+o.id.slice(-4).toUpperCase()+' · '+esc(o.mesero||"—")+' · '+PAGO_LABEL[o.pago||""]+'</div>'
        + '<div class="v-ticket-items">'+its+'</div><div class="v-ticket-total">'+fmt(o.total)+'</div></div>';
    }).join("") + (list.length > MAXL ? '<div class="k-empty">Y '+(list.length-MAXL)+' cuentas más. Descarga el Excel para verlas todas.</div>' : '') : '<div class="k-empty">No hay cuentas cobradas en este periodo.</div>';
    var cortesDia = cortes.filter(function(c){ return single ? c.dia === from : (c.dia>=from && c.dia<=to); });
    var cortesHtml = cortesDia.length ? cortesDia.map(function(c){
      var ok = Math.abs(c.diferencia||0) < 0.005;
      return '<div class="v-corte-item"><div><b>'+(single?'':c.dia.slice(5)+' · ')+hhmm(c.createdAt)+'</b> · '+esc(c.responsable)+'<div class="v-ticket-sub">Esperado '+fmt(c.esperado)+' · Contado '+fmt(c.contado)+' · Ventas '+fmt(c.totalVentas)+' ('+c.cuentas+' cuentas)</div></div><b class="'+(ok?'v-ok':(c.diferencia>0?'v-plus':'v-minus'))+'">'+(ok?'Cuadra':(c.diferencia>0?'+':'−')+fmt(Math.abs(c.diferencia)))+'</b></div>';
    }).join("") : '<div class="k-empty">Aún no hay cortes guardados'+(single?' este día':' en este periodo')+'.</div>';

    var corteHtml = single
      ? '<div class="adm-section"><h3 class="font-display">Corte de caja</h3><div class="adm-help">Compara el efectivo que hay en caja con lo que registró el sistema.</div>'
          + '<div class="v-form">'
            + '<label>Fondo inicial<input class="adm-input" inputmode="decimal" placeholder="0" value="'+esc(corte.fondo)+'" oninput="App.setField(\'fondo\',this.value)"></label>'
            + '<label>Efectivo contado<input class="adm-input" inputmode="decimal" placeholder="¿Cuánto hay en caja?" value="'+esc(corte.contado)+'" oninput="App.setField(\'contado\',this.value)"></label>'
            + '<label>Responsable<input class="adm-input" placeholder="Nombre" value="'+esc(corte.responsable)+'" oninput="App.setField(\'responsable\',this.value)"></label>'
          + '</div>'
          + '<div id="v-corte-calc" class="v-calc">'+corteCalcHtml(list)+'</div>'
          + (corte.msg ? '<div class="adm-msg '+corte.kind+'" style="margin:10px 0 0">'+esc(corte.msg)+'</div>' : '')
          + '<button class="send-btn" style="margin-top:14px" onclick="App.saveCorte()"'+(corte.saving?' disabled':'')+'>'+(corte.saving?'Guardando…':'Guardar corte')+'</button>'
          + '<div class="caja-section-label" style="margin-top:18px">Cortes guardados</div>'+cortesHtml
        + '</div>'
      : '<div class="adm-section"><h3 class="font-display">Cortes de caja del periodo</h3>'+cortesHtml+'</div>';

    app.innerHTML =
      '<div class="k-header"><div><div class="k-title font-display">Ventas y corte &middot; '+RESTAURANT+'</div><div class="k-sub">Historial de cuentas cobradas</div></div>'
        + '<button class="k-lock-btn" onclick="App.lockScreen()" title="Bloquear">🔒</button></div>'
      + '<div class="adm-wrap v-wrap">'
        + '<div class="adm-section">'
          + '<div class="v-quick">'
            + ['hoy','ayer','7','mes'].map(function(k){ return '<button class="caja-chip'+(isQ(k)?' active':'')+'" onclick="App.quick(\''+k+'\')">'+({hoy:"Hoy",ayer:"Ayer","7":"Últimos 7 días",mes:"Este mes"})[k]+'</button>'; }).join("")
          + '</div>'
          + '<div class="v-dates"><label>Desde<input type="date" class="adm-input" value="'+from+'" max="'+today+'" onchange="App.onDate(\'from\',this.value)"></label>'
          + '<label>Hasta<input type="date" class="adm-input" value="'+to+'" max="'+today+'" onchange="App.onDate(\'to\',this.value)"></label></div>'
          + '<div class="v-range">'+rangeLabel+'</div>'
        + '</div>'
        + '<div class="v-kpis">'
          + '<div class="v-kpi"><span>Total vendido</span><b>'+fmt(s.total)+'</b></div>'
          + '<div class="v-kpi"><span>Cuentas cobradas</span><b>'+s.n+'</b></div>'
          + '<div class="v-kpi"><span>Ticket promedio</span><b>'+fmt(avg)+'</b></div>'
          + '<div class="v-kpi v-kpi-open"><span>Por cobrar ahora</span><b>'+fmt(openTotal)+'</b><small>'+open.length+' pedido'+(open.length===1?'':'s')+' abierto'+(open.length===1?'':'s')+'</small></div>'
        + '</div>'
        + '<div class="adm-section"><h3 class="font-display">Por forma de pago</h3>'+pagoHtml+'</div>'
        + corteHtml
        + '<div class="adm-section"><h3 class="font-display">Platillos más vendidos</h3>'+platHtml+'</div>'
        + '<div class="adm-section"><h3 class="font-display">Ventas por hora</h3>'+horaHtml+'</div>'
        + '<div class="adm-section"><h3 class="font-display">Por mesero</h3>'+meseroHtml+'</div>'
        + '<div class="adm-section"><div class="v-head-row"><h3 class="font-display">Cuentas cobradas</h3><button class="caja-btn" onclick="App.exportCSV()"'+(list.length?'':' disabled style="opacity:.5"')+'>Descargar Excel (CSV)</button></div>'+cuentasHtml+'</div>'
      + '</div>';
  }

  if (window.claude && window.claude.use){
    window.claude.use("db").then(function(d){
      db = d; loaded = true;
      cfgStore(db).get().then(function(data){
        cfg = data;
        locked = readLocal("sl_admin_unlocked") !== currentPin();
        if (!locked) startWatch();
        render();
      }).catch(function(){ if (!locked) startWatch(); render(); });
    }).catch(function(){ loaded = true; render(); });
  } else { loaded = true; }

  window.App = { submitPin: submitPin, lockScreen: lockScreen, quick: quick, onDate: onDate, setField: setField, saveCorte: saveCorte, exportCSV: exportCSV };
  render();
}

// Cambiar el "#" en la misma pestaña (p.ej. de #cocina a #caja) no recarga
// la página por sí solo en los navegadores — forzamos recarga para que
// siempre se abra la sección correcta.
window.addEventListener("hashchange", function(){ location.reload(); });

if (location.hash === "#cocina") { CocinaApp(); }
else if (location.hash === "#caja") { CajaApp(); }
else if (location.hash === "#admin") { AdminApp(); }
else if (location.hash === "#ventas") { VentasApp(); }
else { ClienteApp(); }
</script>
